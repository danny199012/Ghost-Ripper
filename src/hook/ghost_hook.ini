; ghost_hook.ini — configuration for the Ghost-Ripper hook DLL.
; Place this file next to ghost_hook.dll.

[capture]
; Virtual-key code for the capture hotkey. Default: F9 (0x78).
; Common values: F8=0x77, F9=0x78, F10=0x79, F11=0x7A, F12=0x7B
hotkey=0x78

; Output directory for captures. Default: %USERPROFILE%\Documents\GhostRipper
; Leave empty to use the default.
output_dir=

; Whether to dump bound textures as DDS files. 1=yes (default), 0=no.
textures=1
